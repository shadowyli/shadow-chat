name: 改进建议 / Feature request
description: 描述一个实际使用场景和期望改进
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        先搜索已有建议，请用脱敏示例说明实际需求。
        Chinese and English suggestions are welcome.
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Scenario and problem
      description: 你要完成什么任务？当前在哪一步受阻？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法 / Alternatives tried
