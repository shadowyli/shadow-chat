name: 问题报告 / Bug report
description: 报告可复现的安装、聊天、传输或界面错误
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有问题，截图和日志请脱敏；不要上传账号目录、聊天记录、备份或恢复配置。
        安全漏洞请按 [安全说明](https://github.com/shadowyli/shadow-chat/blob/main/SECURITY.md) 联络。
        Chinese and English reports are welcome.
  - type: input
    id: version
    attributes:
      label: 版本与安装包 / Version and package
      description: 如 1.1.8、local/test、完整安装包名；自编译请附提交号。
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 系统与环境 / System
      description: Windows 版本、缩放比例；网络问题可说明是否同网段、是否双向可见，不必公开 IP。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 用合成账号和文件描述最小复现过程，说明是否每次发生。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或补充信息 / Sanitized evidence
      description: 请先检查个人、公司、路径和聊天信息；可说明已尝试的方法。
